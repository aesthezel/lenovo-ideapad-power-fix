# Keep the FnLock LED indicator synchronized via the ideapad_laptop driver
options ideapad_laptop set_fn_lock_led=1

# Prevent snd_rn_pci_acp3x from powering up the AMD Audio Coprocessor (1022:15e2)
# into D0 and leaving it unbound (Lenovo IdeaPad models using Realtek ALC257
# route internal audio & microphone through snd_hda_intel instead).
# If your model actually uses the ACP for audio, comment out the line below.
blacklist snd_rn_pci_acp3x
