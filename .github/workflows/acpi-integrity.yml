name: ACPI table integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-aml:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install ACPICA tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends acpica-tools

      - name: Verify the SSDT bridge (rebuild from the audited DSL)
        run: bash ./verify-aml.sh
